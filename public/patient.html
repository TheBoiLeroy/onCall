<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Call for help">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
  <title>CareCall</title>
</head>
<body class="patient">
<main>
  <div class="row" style="justify-content: space-between">
    <div class="brand"><img src="/icon.svg" alt=""><h1 id="hello">Hello</h1></div>
    <span class="pill"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></span>
  </div>

  <div id="error" class="card hidden"></div>

  <div id="ui" class="hidden">
    <button class="call-btn" id="callBtn">Call<br><span id="cgName"></span></button>
    <div class="status" id="status" aria-live="assertive"></div>
    <p style="text-align:center"><button class="secondary hidden" id="cancelBtn">Never mind — cancel call</button></p>

    <h2 style="margin-top:20px">Or tell them what you need</h2>
    <div class="quick" id="quick"></div>
  </div>
</main>
<script src="/store.js"></script>
<script src="/patient.js"></script>
</body>
</html>
