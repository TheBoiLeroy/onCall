<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
  <title>CareCall — Join as caregiver</title>
</head>
<body>
<main>
  <div class="brand"><img src="/icon.svg" alt=""><h1>CareCall</h1></div>

  <div id="error" class="card hidden"></div>

  <form class="card hidden" id="join">
    <h2 id="heading">Join as a caregiver</h2>
    <p class="muted" id="who"></p>
    <label for="name">Your name (shown to them)</label>
    <input id="name" placeholder="e.g. Alex" maxlength="60" required>
    <p><button type="submit">Join &amp; open my dashboard</button></p>
  </form>
</main>
<script src="/store.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const tok = location.pathname.split('/')[2];

  function showError(msg) {
    $('join').classList.add('hidden');
    $('error').classList.remove('hidden');
    $('error').innerHTML = `<b>${CareStore.esc(msg)}</b><p><a href="/">Back to start</a></p>`;
  }

  (async () => {
    const res = await fetch(`/api/invite/${tok}`);
    const room = await res.json();
    if (!res.ok) return showError(room.error);
    // Already a caregiver for this person on this device: go straight to the dashboard.
    if (CareStore.get(room.id)) return location.replace(`/caregiver/${room.id}`);
    $('heading').textContent = `Help care for ${room.patientName}`;
    $('who').textContent = `You'll be rung along with ${room.caregiverName} whenever ${room.patientName} presses their call button.`;
    $('join').classList.remove('hidden');
    $('name').focus();
  })();

  $('join').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch(`/api/invite/${tok}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('name').value }),
    });
    const room = await res.json();
    if (!res.ok) return showError(room.error);
    CareStore.add(room);
    location.href = `/caregiver/${room.id}`;
  });
</script>
</body>
</html>
